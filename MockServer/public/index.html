<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Port Inspection Dashboard</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --danger-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --glass: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            background: var(--glass);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #edf2f7;
        }

        .sensor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .sensor-item:last-child { border-bottom: none; }

        .label { color: #718096; font-weight: 600; }
        .value { color: #2d3748; font-size: 1.25rem; font-weight: 700; }

        .image-view {
            width: 100%;
            aspect-ratio: 4/3;
            background: #2d3748;
            border-radius: 12px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #718096;
            overflow: hidden;
            position: relative;
        }

        .image-view img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary { background: var(--primary-gradient); }
        .btn-danger { background: var(--danger-gradient); }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .btn:active { transform: translateY(0); }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 700;
            background: #e2e8f0;
            margin-top: 10px;
        }

        .badge-live { background: #c6f6d5; color: #2f855a; }
        .badge-offline { background: #fed7d7; color: #9b2c2c; }

        @keyframes blink { 50% { opacity: 0; } }
        .rec-dot {
            width: 10px;
            height: 10px;
            background: #f56565;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: blink 1s infinite;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>⚓ Port System Mock Dashboard</h1>
            <p id="time">Last Update: Waiting...</p>
        </div>

        <div class="grid">
            <div class="main-panel">
                <div class="card">
                    <h2 style="margin-bottom: 15px;">Live Stream</h2>
                    <div class="image-view" id="imageView">
                        No Image Received
                    </div>
                </div>
            </div>

            <div class="side-panel">
                <div class="card" style="margin-bottom: 20px;">
                    <div class="sensor-item">
                        <span class="label">Temperature</span>
                        <span class="value" id="temp">--°C</span>
                    </div>
                    <div class="sensor-item">
                        <span class="label">EC Value</span>
                        <span class="value" id="ec">-- μS/cm</span>
                    </div>
                    <div class="sensor-item">
                        <span class="label">Status</span>
                        <span class="status-badge badge-live" id="statusBadge">
                            <span class="rec-dot"></span>LIVE
                        </span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-primary" onclick="sendCommand('INSPECT')">Inspect Start</button>
                    <button class="btn btn-danger" onclick="sendCommand('STOP')">Emergency Stop</button>
                </div>
                
                <div style="margin-top: 20px; font-size: 0.8rem; color: #a0aec0; line-height: 1.5;">
                    <p><b>Usage:</b><br>
                    1. ESP32를 동일한 WiFi에 연결하세요.<br>
                    2. ESP32 코드의 SERVER_URL을 이 서버의 IP로 수정하세요.<br>
                    3. 데이터를 받으면 자동으로 화면이 갱신됩니다.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const { sensorData } = data;
                
                if (sensorData.timestamp) {
                    document.getElementById('temp').innerText = sensorData.temperature.toFixed(2) + '°C';
                    document.getElementById('ec').innerText = sensorData.ec_value.toFixed(2) + ' μS/cm';
                    document.getElementById('time').innerText = 'Last Update: ' + sensorData.timestamp;
                    
                    if (sensorData.image_data) {
                        document.getElementById('imageView').innerHTML = `<img src="${sensorData.image_data}" alt="Stream">`;
                    }
                }
            } catch (err) {
                console.error('Update Failed', err);
            }
        }

        async function sendCommand(command) {
            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });
                const result = await response.json();
                alert('Command Sent: ' + command);
            } catch (err) {
                alert('Command Failed');
            }
        }

        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
